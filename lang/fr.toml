abrev = "douzaine"
facteur = 12                 # « une douzaine d'oeufs » = 12 pièces
formes = ["douzaine", "douzaines"]

[unites.dizaine]
dimension = "compte"
singulier = "dizaine"
pluriel = "dizaines"
abrev = "dizaine"
facteur = 10
# 110 lignes, « une dizaine de tomates cerises ». Le facteur est une
# approximation assumée : personne ne compte.
formes = ["dizaine", "dizaines"]

[unites.vingtaine]
dimension = "compte"
singulier = "vingtaine"
pluriel = "vingtaines"
abrev = "vingtaine"
