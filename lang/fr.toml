formes = ["vingtaine", "vingtaines"]

[unites.moitie]
dimension = "compte"
singulier = "moitié"
pluriel = "moitiés"
abrev = "moitié"
facteur = 0.5
# « 1 demi d'oignon » : 99 lignes chez Marmiton, où « demi » est publié comme
# unité à part entière. Devant une autre unité (« demi litre »), c'est le
# multiplicateur de la section [qualificatifs] qui s'applique.
formes = ["moitié", "moitiés", "demi", "demis", "demie", "demies"]

